# Lint memory and find what git cannot see: two branches superseding the same decision fails,
# the same decision added twice warns. Runs on the PR's merge result against the base branch.
name: memory
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # standings, drift and the edit rule read history
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nio/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: uv run nio index --check --base origin/${{ github.base_ref }}
