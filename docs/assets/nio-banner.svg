<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="NIO: trustworthy, traceable, cheaper agent-built software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <!-- jury: three jurors converge on one verdict -->
  <g transform="translate(930 180)" stroke="url(#ink)" stroke-width="3" fill="none">
    <circle r="118" stroke-opacity="0.25" stroke-dasharray="4 10"/>
    <line x1="0" y1="-92" x2="0" y2="0"/>
    <line x1="-80" y1="46" x2="0" y2="0"/>
    <line x1="80" y1="46" x2="0" y2="0"/>
    <circle cy="-92" r="18" fill="#0b1020"/>
    <circle cx="-80" cy="46" r="18" fill="#0b1020"/>
    <circle cx="80" cy="46" r="18" fill="#0b1020"/>
    <circle r="26" fill="url(#ink)" stroke="none"/>
    <path d="M-11 0l7 8 15-16" stroke="#0b1020" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="80" y="200" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="8" fill="url(#ink)">NIO</text>
  <text x="84" y="250" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#e2e8f0">Agent-built software you can trust, trace and afford.</text>
  <text x="84" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#94a3b8">grill · gate · jury · remember · recall</text>
</svg>
