[project]
name = "nio"
version = "0.0.1"
description = "NIO CLI: flow, jury, memory, onboarding and agents for agent-built software"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9.0",
    "ruamel.yaml>=0.18",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
nio = "nio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"tools/claude-mods" = "nio/mods"
