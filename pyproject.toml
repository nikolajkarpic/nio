[project]
name = "nio"
version = "0.0.1"
description = "NIO memory CLI: write, check, index and query .nio/memory records"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18"]

[project.scripts]
nio = "nio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
